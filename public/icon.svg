<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Wallet -->
  <rect x="80" y="250" width="260" height="140" rx="20" fill="#ffffff" opacity="0.95"/>
  <rect x="80" y="290" width="260" height="40" fill="#e5e7eb"/>

  <!-- Credit Card -->
  <rect x="120" y="270" width="200" height="80" rx="12" fill="url(#accent)"/>
  <rect x="120" y="300" width="200" height="12" fill="#ffffff" opacity="0.6"/>

  <!-- Rupee Symbol Circle -->
  <circle cx="180" cy="200" r="70" fill="#ffffff"/>
  <text x="180" y="225" font-size="80" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif">₹</text>

  <!-- Bank -->
  <g transform="translate(300,130)">
    <polygon points="0,40 80,0 160,40" fill="#ffffff"/>
    <rect x="10" y="40" width="140" height="20" fill="#ffffff"/>
    <rect x="20" y="60" width="20" height="70" fill="#ffffff"/>
    <rect x="70" y="60" width="20" height="70" fill="#ffffff"/>
    <rect x="120" y="60" width="20" height="70" fill="#ffffff"/>
    <rect x="10" y="130" width="140" height="20" fill="#ffffff"/>
  </g>
</svg>